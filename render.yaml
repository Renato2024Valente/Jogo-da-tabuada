services:
  - type: web
    name: galeria-fotos-sql
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    autoDeploy: true
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PIN
        value: "4321"
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: bicudotutoria        # <- NOME do recurso Postgres no Render
          property: internalConnectionString  # usa URL interna (.internal)
    disks:
      - name: data
        mountPath: /var/data
        sizeGB: 2

databases:
  - name: bicudotutoria
